# electron-builder の設定。Steam 向けなので Windows / Linux は dir 出力（インストーラ不要）。
# macOS は universal の .app。署名・公証は CI の環境変数で行う（docs/STEAM.md）。
appId: dev.yuksew.sankyu
productName: 三球
copyright: Copyright © 2026 yuksew
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!steam_appid.txt"
# steamworks.js はネイティブモジュール + steam_api ライブラリを dist/ に持つので asar の外に出す
asarUnpack:
  - "**/*.node"
  - "node_modules/steamworks.js/**"
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  target:
    - target: dir
      arch: [x64]
mac:
  target:
    - target: dir
      arch: [universal]
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
linux:
  target:
    - target: dir
      arch: [x64]
  category: Game
npmRebuild: false
publish: null
